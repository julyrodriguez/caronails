<!DOCTYPE html>
<html lang="es" class="h-full bg-[#FAF5F8]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Caro Nails Studio</title>
    
    <!-- PWA & Mobile Web App Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#D48C9E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Caro Nails" />
    <link rel="apple-touch-icon" href="/iconCaro.jpeg" />
    <link rel="icon" type="image/jpeg" href="/iconCaro.jpeg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('Service Worker registrado:', reg.scope))
            .catch(err => console.log('Error en Service Worker:', err));
        });
      }
    </script>
  </head>
  <body class="h-full text-[#2E1E2F] antialiased selection:bg-[#D48C9E]/20 selection:text-[#2E1E2F]">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
